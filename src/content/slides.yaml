# --- Roka ---
- type: story
  photo: "media/Wedding - Pooja y Roka/Roka 01.jpg"
  title:
    pt: "Roka — o noivado do irmão"
    en: "Roka — the brother's engagement"
  text:
    pt: |
      A **Roka** significa "parar". Essa cerimônia simboliza que aquele casal encontrou a pessoa com quem
      quer casar e vai "parar de procurar".

      Mais do que um noivado, é uma declaração pública de que as famílias vão se unir e abençoam a união.
    en: |
      The **Roka** means "to stop". This ceremony is a symbol of the couple stopping their search
      for a partner because they have committed to their spouse-to-be.

      More than an engagement, it's a public declaration that both families will be united and bless the union.
  layout: "photo-left"
  location: "Wedding Venue, Jaipur"

- type: story
  photo: "media/Wedding - Mehendi/Wedding - Mehendi 01.jpg"
  title:
    pt: "Noite do Mehendi"
    en: "Mehendi Night"
  text:
    pt: |
      Designs intrincados de hena nas mãos e pés,
      cada padrão contando uma história de amor e bênçãos.

      **A noiva esconde o nome do noivo no design dela e ele tem que tentar achar.**

      Acredita-se que quanto mais escura a cor do desenho depois de seco, maior é o amor do seu parceiro.
    en: |
      Intricate henna designs on hands and feet,
      each pattern telling a story of love and blessings.

      **The bride can hide the groom's name within the design and have him try to find it.**

      Some believe that the darker the color of the dried design signifies how deep your partner loves you.
  layout: "photo-right"
  location: "Wedding Venue, Jaipur"

