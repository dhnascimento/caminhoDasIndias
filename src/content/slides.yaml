# --- Pooja ---
- type: story
  photo: "media/Wedding - Pooja y Roka/Pooja 01.JPG"
  title:
    pt: "Pooja — Oração Sagrada"
    en: "Pooja — Sacred Prayer"
  text:
    pt: |
      A **Pooja** é um momento de profunda espiritualidade que marca o início oficial das celebrações do casamento.

      Esse ritual avisa para os deuses que aquele casal vai casar e invoca as bênçãos divinas para o casal.
    en: |
      The **Pooja** marks the official start of the wedding celebrations.

      It tells the gods that the couple will get married and it invokes divine blessings for the couple.
  layout: "photo-right"
  location: "Wedding Venue, Jaipur"

